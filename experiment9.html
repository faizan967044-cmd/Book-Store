<!DOCTYPE html>
<html>
<head>
    <title>Background Repeat and Link Styles</title>

    <style>
        body {
            background-image: url("https://via.placeholder.com/100");
            background-repeat: repeat-x; 
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        a:link {
            color: blue;
            text-decoration: none;
        }
        a:visited {
            color: purple;
        }
        a:hover {
            color: red;
            text-decoration: underline;
        }
        a:active {
            color: green;
        }
    </style>
</head>

<body>

    <h1>CSS Background Repeat Example</h1>

    <p>
        This page uses a background image with
        <strong>background-repeat: repeat-x;</strong>
    </p>

    <h2>Link Styling Example</h2>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <br><br>

    <a href="https://www.microsoft.com" target="_blank">
        Visit Microsoft
    </a>

</body>
</html>
